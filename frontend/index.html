<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS 3-Tier Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AWS 3-Tier Task Manager</h1>
        <p class="subtitle">Simple task management application</p>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button onclick="addTask()">Add Task</button>
        </div>

        <p id="message"></p>

        <div id="taskList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
